services:
  bayradar:
    build: .
    container_name: bayradar
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/data/bayradar.db
      - APP_SECRET=${APP_SECRET:-default-change-me-in-production}
      - EBAY_MOCK_MODE=${EBAY_MOCK_MODE:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - bayradar_data:/app/prisma/data

volumes:
  bayradar_data:
